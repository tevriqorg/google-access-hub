name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Gofmt check
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt required"; gofmt -d .; exit 1; }
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
